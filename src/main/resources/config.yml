  - "&7&m---»--*-------------------------------------*--«---"

judgement-days:  
  started-broadcast:
  - "&7&m---»--*-------------------------------------*--«---"
  - "&bᴅᴏʀᴀʏᴀᴋɪᴍᴄ Judgement Day v1 ha avuto inizio..."
  - "&7&m---»--*-------------------------------------*--«---"  
