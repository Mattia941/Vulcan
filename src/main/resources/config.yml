prefix: '&b&lᴅᴏʀᴀʏᴀᴋɪᴍᴄ &8»'

alerts:  
  format: '%prefix% &f%player% &7ha fallito &f%check% %dev%&7(&fᴛɪᴘᴏ %type%&7)%dev% &7[&4%vl%&7/&4%max-vl%&7]'
  
  hover-message:
  - '&7ᴘɪɴɢ: &c%ping% &8| &7ᴛᴘꜱ: &c%tps% &8| &7ᴠᴇʀꜱɪᴏɴᴇ: &c%version% &8| &7ᴄʟɪᴇɴᴛ: &c%client-brand%'
  - ''
  - '&7ᴅᴇꜱᴄʀɪᴢɪᴏɴᴇ:'
  - '&7%description%'
  - ''
  - '&7ɪɴꜰᴏʀᴍᴀᴢɪᴏɴɪ:'
  - '&7%info%'
  - ''
  - '&7ᴄʟɪᴄᴄᴀ ᴘᴇʀ ᴛᴇʟᴇᴘᴏʀᴛᴀʀᴛɪ ᴀ &b%player%&7.'  

  click-commands:
  - '/vulcan clickalert %player%'  

  click-alert-command-commands:
  - 'tp %player%'  

  toggled-on-message: '%prefix% &7ᴀᴠᴠɪꜱɪ ᴅɪ ᴠᴜʟᴄᴀɴ &aᴀᴛᴛɪᴠᴀᴛɪ&7!'  
  toggled-off-message: '%prefix% &7ᴀᴠᴠɪꜱɪ ᴅɪ ᴠᴜʟᴄᴀɴ &cᴅɪꜱᴀᴛᴛɪᴠᴀᴛɪ&7!'  
  print-to-console: true  
  console-format: '[Vulcan] %player% ha fallito %check% %dev%(Tipo %type%)%dev% (%vl%/%max-vl%)'  

  custom-commands: []  

  severity:    
    violations:      
      2: 4 
      3: 8 
      4: 12 
      5: 16 
      6: 16 
      7: 16 
      8: 16 
      9: 16 
      10: 16 
    colors: 
      1: '&a' 
      2: '&e' 
      3: '&6' 
      4: '&c' 
      5: '&4' 
      6: '&4' 
      7: '&4' 
      8: '&4' 
      9: '&4' 
      10: '&4'  

  experimental-symbol: "*"

verbose:  
  format: '%prefix% &f%player% &7verbosed &f%check% &7(&f%type%&7) %dev% &7[&4%percent%%&7]'  
  hover-message:
  - '&7ᴘɪɴɢ: &c%ping% &8| &7ᴛᴘꜱ: &c%tps% &8| &7ᴠᴇʀꜱɪᴏɴᴇ: &c%version%'
