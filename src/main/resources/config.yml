  - "ban %player% &c[Vulcan] Judgement Day v1"  
  broadcast:
  - '&7&m---»--*-------------------------------------*--«---'
  - '&c%player% &7è stato bannato per &c[Vulcan] Judgement Day v1&7.'
  - '&7&m---»--*-------------------------------------*--«---'  
  cooldown: 1000  
  run-at-interval: false  
  interval: 36000

freeze:  
  logged-out-while-frozen-commands: []

join-message:  
  enabled: false  
  message:
  - ''
  - '&4&lᴀᴛᴛᴇɴᴢɪᴏɴᴇ &cIl butterfly clicking è fortemente sconsigliato e potrebbe causare un ban!'
