  click-commands:
  - '/tp %player%'  
  toggled-on-message: '%prefix% &7ᴠᴇʀʙᴏꜱᴇ ᴅɪ ᴠᴜʟᴄᴀɴ &aᴀᴛᴛɪᴠᴀᴛᴏ&7!'  
  toggled-off-message: '%prefix% &7ᴠᴇʀʙᴏꜱᴇ ᴅɪ ᴠᴜʟᴄᴀɴ &cᴅɪꜱᴀᴛᴛɪᴠᴀᴛᴏ&7!'

log-file:  
  enabled: true  
  alert-message: "%player% ha fallito %check% %dev%(Tipo %type%)%dev% [VL: %vl%] [Ping: %ping%] [TPS: %tps%] [Versione: %version%]"  
  punishment-message: "%player% è stato punito per %check% %dev%(Tipo %type%)%dev% [VL: %vl%] [Ping: %ping%] [TPS: %tps%]"

punishment-file:  
  enabled: true

violation-reset:  
  enabled: true  
  interval-in-minutes: 8  
  message-enabled: true  
  message: '%prefix% &7Le violazioni per tutti i giocatori online sono state azzerate!'

client-brand-alerts:  
  resolve: true  
  enabled: true  
  ignore-alerts-list:
  - 'vanilla'  
  message: '%prefix% &c%player% &7è entrato usando &f%client-brand%&7!'  
  blocked-client-brands: []  
  unallowed-client-brand-kick-message: '&cNon puoi entrare con %client-brand%!'  
  console: false  
  console-message: '[Vulcan] %player% è entrato usando %client-brand%!'  
  whitelist-enabled: false  
  whitelisted-client-brands: []

connection:  
  transaction:    
    kick-enabled: true    
    max-delay: 45000    
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'    
    staff-alert-message: '%prefix% &c%player% &7è stato espulso per non aver risposto ai pacchetti Transaction! &7(&c%delay%ᴍꜱ&7)'    
    console-message: '[Vulcan] &c%player% &7è stato espulso per non aver risposto ai pacchetti Transaction! &7(&c%delay%ᴍꜱ&7)'  
  keepalive:    
    kick-enabled: true    
    max-delay: 45000    
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'    
    staff-alert-message: '%prefix% &c%player% &7è stato espulso per non aver risposto ai pacchetti KeepAlive! &7(&c%delay%ᴍꜱ&7)'    
    console-message: '[Vulcan] &c%player% &7è stato espulso per non aver risposto ai pacchetti KeepAlive! &7(&c%delay%ᴍꜱ&7)'  
  max-ping:    
    kick-enabled: true    
    max-ping: 20000    
    max-ticks: 20    
    kick-message: 'Internal Exception: io.netty.handler.timeout.ReadTimeoutException'    
    staff-alert-message: '%prefix% &c%player% &7è stato espulso per ping troppo alto! &7(&c%ping%ᴍꜱ&7)'    
    console-message: '[Vulcan] &c%player% &7espulso per ping troppo alto! &7(&c%ping%ᴍꜱ&7)'

punishments:  
  message: '%prefix% &c%player% &7è stato punito per &f%check% &7(&fᴛɪᴘᴏ %type%&7) &7[&4x%vl%&7]'  
  broadcast:
  - "&7&m---»--*-------------------------------------*--«---"
