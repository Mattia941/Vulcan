  - "&c/vulcan kb (giocatore) &8 | &c/vulcan knockback (giocatore) &8- &7Applica contraccolpo."
  - "&c/vulcan checks &8- &7Mostra tutti i controlli attivi."
  - "&c/vulcan connection (giocatore) &8- &7Mostra le info di connessione del giocatore."
